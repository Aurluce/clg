services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clg}
      POSTGRES_USER: ${POSTGRES_USER:-clg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - clg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clg} -d ${POSTGRES_DB:-clg}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clg_postgres_data: